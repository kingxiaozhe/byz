<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BYZ workflow isolation</title><desc id="desc">Each BYZ session selects CM, CM Plugin, or no managed workflow. Only one can be active.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09111F"/><stop offset="1" stop-color="#101C30"/></linearGradient></defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="54" y="62" font-size="15" font-weight="750" fill="#F5B942" letter-spacing="2">ONE SESSION · ONE MANAGED WORKFLOW</text>
    <text x="54" y="101" font-size="30" font-weight="780" fill="#F7F2E8">Explicit selection. Separate roots. No cross-loading.</text>
    <g transform="translate(54 142)"><rect width="324" height="190" rx="18" fill="#17243A" stroke="#F5B942" stroke-width="2"/><rect x="20" y="20" width="82" height="28" rx="14" fill="#F5B942"/><text x="61" y="39" text-anchor="middle" font-size="13" font-weight="800" fill="#09111F">DEFAULT</text><text x="20" y="88" font-size="27" font-weight="780" fill="#F7F2E8">CM Workflow</text><text x="20" y="121" font-size="17" fill="#A9B8CC">Bundled with BYZ</text><text x="20" y="150" font-size="17" fill="#A9B8CC">Public · version-locked</text><text x="20" y="176" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#F5B942">byz --workflow cm</text></g>
    <g transform="translate(438 142)"><rect width="324" height="190" rx="18" fill="#131F33" stroke="#40516A"/><rect x="20" y="20" width="76" height="28" rx="14" fill="#263650"/><text x="58" y="39" text-anchor="middle" font-size="13" font-weight="800" fill="#A9B8CC">OPT-IN</text><text x="20" y="88" font-size="27" font-weight="780" fill="#F7F2E8">CM Plugin</text><text x="20" y="121" font-size="17" fill="#A9B8CC">Bundled with BYZ</text><text x="20" y="150" font-size="17" fill="#A9B8CC">Pinned release version</text><text x="20" y="176" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#A9B8CC">byz --workflow cm-plugin</text></g>
    <g transform="translate(822 142)"><rect width="324" height="190" rx="18" fill="#0C1627" stroke="#40516A"/><rect x="20" y="20" width="84" height="28" rx="14" fill="#263650"/><text x="62" y="39" text-anchor="middle" font-size="13" font-weight="800" fill="#A9B8CC">EXPLICIT</text><text x="20" y="88" font-size="27" font-weight="780" fill="#F7F2E8">None</text><text x="20" y="121" font-size="17" fill="#A9B8CC">No managed workflow</text><text x="20" y="150" font-size="17" fill="#A9B8CC">Base runtime only</text><text x="20" y="176" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#A9B8CC">byz --workflow none</text></g>
  </g>
</svg>
