<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">BYZ release contract</title><desc id="desc">The byz update command installs one BYZ release containing its selected workflow versions and Pi baseline.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09111F"/><stop offset="1" stop-color="#101C30"/></linearGradient></defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="54" y="58" font-size="15" font-weight="750" fill="#F5B942" letter-spacing="2">THE RELEASE IS THE CONTRACT</text><text x="54" y="99" font-size="30" font-weight="780" fill="#F7F2E8">Users update BYZ. BYZ brings the matching system.</text>
    <g transform="translate(54 146)"><rect width="248" height="108" rx="18" fill="#17243A" stroke="#40516A"/><text x="22" y="39" font-size="14" font-weight="700" fill="#7F90A8" letter-spacing="1">USER COMMAND</text><text x="22" y="78" font-family="SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700" fill="#F5B942">byz update</text></g>
    <path d="M302 200H386" stroke="#F5B942" stroke-width="3"/><path d="M376 192L388 200 376 208" fill="none" stroke="#F5B942" stroke-width="3"/>
    <g transform="translate(388 130)"><rect width="304" height="140" rx="20" fill="#F5B942"/><text x="24" y="40" font-size="14" font-weight="800" fill="#4A411F" letter-spacing="1">NPM RELEASE</text><text x="24" y="78" font-size="25" font-weight="850" fill="#09111F">@aibyzero/byz</text><text x="24" y="112" font-size="17" font-weight="700" fill="#384052">One tested compatibility set</text></g>
    <path d="M692 200H776" stroke="#F5B942" stroke-width="3"/><path d="M766 192L778 200 766 208" fill="none" stroke="#F5B942" stroke-width="3"/>
    <g transform="translate(778 130)"><rect width="368" height="140" rx="20" fill="#131F33" stroke="#40516A"/><text x="24" y="38" font-size="14" font-weight="700" fill="#7F90A8" letter-spacing="1">SELECTED BY THAT RELEASE</text><text x="24" y="72" font-size="19" font-weight="760" fill="#F7F2E8">CM version · CM Plugin contract</text><text x="24" y="103" font-size="19" font-weight="760" fill="#F7F2E8">Pi source baseline</text><text x="24" y="128" font-size="15" fill="#A9B8CC">No workflow-only or Pi-channel update</text></g>
    <text x="54" y="305" font-size="16" fill="#7F90A8">Maintainers change the set during BYZ development; users receive it only through a BYZ release.</text>
  </g>
</svg>
