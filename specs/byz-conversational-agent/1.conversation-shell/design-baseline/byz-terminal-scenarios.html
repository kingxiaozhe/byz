<!doctype html>
<!-- BYZ terminal scenario gallery. Product prototype only; no commands are executed. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYZ terminal scenarios</title>
<style>
:root{--ink:#dce7dc;--dim:#8a9c8d;--bg:#102019;--bg2:#172b22;--line:#395343;--green:#a9dfa8;--gold:#f4cc70;--orange:#ff9b78;--red:#ff8379;--paper:#efece1}*{box-sizing:border-box}body{margin:0;background:#e6e2d7;color:#17211a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-width:1050px}.wrap{max-width:1250px;margin:auto;padding:42px 38px 65px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:31px}.intro h1{font:700 42px/1 Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:0}.intro p{max-width:510px;line-height:1.65;color:#596158;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid #cbc5b8;background:#f8f5ed;color:#566056;padding:9px 13px;border-radius:999px;font-size:13px;cursor:pointer}.tabs button.active{background:#1d382b;color:#fff;border-color:#1d382b}.stage{display:grid;grid-template-columns:220px 1fr;gap:22px}.legend{padding:23px;background:#f8f5ed;border:1px solid #d8d2c5;border-radius:14px;height:max-content}.legend strong{display:block;font:700 19px Georgia,"Songti SC",serif;margin-bottom:10px}.legend p{font-size:13px;line-height:1.65;color:#657066}.legend hr{border:0;border-top:1px solid #ddd7ca;margin:17px 0}.legend b{display:block;font-size:12px;margin-bottom:5px}.legend span{font-size:12px;color:#657066;line-height:1.55;display:block}.terminal{min-height:575px;padding:0;background:var(--bg);border-radius:17px;box-shadow:0 24px 70px rgba(28,36,28,.25);overflow:hidden;border:1px solid #263e31}.terminal-bar{height:46px;padding:0 17px;display:flex;align-items:center;gap:7px;background:#183026;border-bottom:1px solid #294637}.dot{width:10px;height:10px;border-radius:50%;background:#50665a}.dot:nth-child(1){background:#dc715f}.dot:nth-child(2){background:#e0b65c}.dot:nth-child(3){background:#75b683}.terminal-title{margin-left:10px;color:#a9bbad;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.screen{display:none;padding:35px 43px;font:15px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.screen.active{display:block;animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.logo{font:700 25px Georgia,"Songti SC",serif;letter-spacing:.14em;color:var(--gold);margin-bottom:25px}.sub{color:var(--dim);margin:4px 0}.label{color:var(--dim);font-size:12px;letter-spacing:.08em}.value{color:var(--ink)}.good{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.gold{color:var(--gold)}.block{margin:22px 0;padding:17px 19px;border-left:2px solid var(--line);background:rgba(255,255,255,.025)}.block.decision{border-left-color:var(--orange);background:rgba(255,155,120,.08)}.block.success{border-left-color:var(--green);background:rgba(169,223,168,.07)}.choice{display:flex;gap:12px;align-items:center;padding:7px 0;color:#c7d6c8}.key{display:inline-grid;place-items:center;width:26px;height:23px;border-radius:4px;border:1px solid #56705e;background:#213c2d;color:#fff;font-size:12px;font-weight:700}.prompt{margin-top:30px;color:var(--green)}.cursor{display:inline-block;width:8px;height:16px;background:var(--green);vertical-align:-2px;animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}.foot{margin-top:28px;color:var(--dim);font-size:12px}.scenario-title{display:none}.desc{margin:0 0 10px;color:#9fb5a3}.small{font-size:13px}.metric{display:grid;grid-template-columns:115px 1fr;gap:6px;margin:4px 0}.metric span:first-child{color:var(--dim)}
</style>
</head>
<body><main class="wrap"><div class="intro"><div><h1>BYZ，不是聊天框。</h1><p>以下是同一个终端在七个业务场景中的输出。每一屏只回答负责人此刻真正需要知道的事，并给出下一步可输入的明确动作。</p></div><p>设计原则：正常时安静；需要业务决定时明确；交付完成时给证据，不给日志。橙色只代表“现在需要你”。</p></div><nav class="tabs" id="tabs"></nav><div class="stage"><aside class="legend"><strong id="legend-title"></strong><p id="legend-copy"></p><hr><b>这一屏验证什么</b><span id="legend-test"></span><hr><b>负责人可以输入</b><span id="legend-input"></span><hr><b>BYZ 不展示什么</b><span>模型选择、token、工具调用、文件路径和原始命令；技术细节仅在负责人主动输入 <code>detail</code> 时展开。</span></aside><section class="terminal"><div class="terminal-bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="terminal-title">byz — business delivery terminal</span></div><div id="screens"></div></section></div></main>
<script>
const scenarios=[
{title:'01 · 开始一个目标',legend:'从一句话开始',copy:'负责人不需要先选项目模板、模型或技术栈。BYZ 先确认要解决的业务结果。',test:'是否能在 60 秒内说明目标，而非填写技术表单。',input:'直接输入业务目标；或输入“继续梳理”。BYZ 也接受 <code>continue</code>。',body:`<div class="logo">BYZ</div><div class="label">新项目 · 还没有任何执行权限</div><div class="block"><span class="value">让美容店客户能在线预约，店员能看到每天安排，并在预约后收到提醒。</span></div><div class="sub">BYZ 将只追问影响第一期范围的问题。它先写规格，后获得执行权限。</div><div class="prompt">› 继续梳理 <span class="cursor"></span></div><div class="foot">任何时刻可输入 <span class="key">quit</span> 放弃本次想法；此时没有文件、代码或成本被产生。</div>`},
{title:'02 · 批准范围',legend:'把“想法”变成边界',copy:'这是第一次关键责任动作。负责人批准的是范围与验收，而不是模糊地“让 AI 做一下”。',test:'是否一眼看出做什么、不做什么，以及完成意味着什么。',input:'输入“批准开始交付”或 <code>A</code>；输入“修改范围”或 <code>B</code>。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label">等待你批准 · 规格 v0.1 · 还没有开始实现</div><div class="block"><div class="gold">本期交付</div><div class="good">✓ 客户选择服务与时间，完成预约</div><div class="good">✓ 店员查看当天全部预约</div><div class="good">✓ 创建预约后发送邮件提醒</div></div><div class="block"><div class="sub">本期不做</div><div>— 在线支付　— 会员积分　— 多门店管理</div></div><div class="block success"><div class="gold">验收标准</div><div>客户 3 分钟内完成预约；店员能看到当日安排；每次预约都有提醒记录。</div></div><div class="choice"><span class="key">A</span> 批准开始交付　　<span class="key">B</span> 修改范围</div><div class="foot">也可直接输入：<span class="value">批准开始交付</span>　或　<span class="value">修改范围</span></div><div class="prompt">› 等待你的决定 <span class="cursor"></span></div>`},
{title:'03 · 正常交付',legend:'正常时保持安静',copy:'执行过程不应该持续索取负责人注意力。BYZ 用一句可理解的状态代替活动流和日志瀑布。',test:'负责人能否确认项目正在向前走，并知道自己现在无需操作。',input:'输入 <code>status</code> 重看本屏；仅在需要时输入 <code>detail</code>。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label">正在交付 · 当前无需你的操作</div><div class="block success"><div class="good">已完成</div><div>预约页面 · 店员日历 · 预约数据保存</div></div><div class="block"><div class="gold">正在验证</div><div>预约创建后，邮件提醒是否可靠触发。</div></div><div class="sub">下一次需要你：仅当范围、验收、交付日期或外部成本发生变化。</div><div class="foot">输入 <span class="key">detail</span> 才展开技术证据；默认保持在业务视图。</div>`},
{title:'04 · 业务取舍',legend:'需要决定时才打扰',copy:'BYZ 不问“要不要执行命令”，而是把技术发现翻译成业务影响和推荐选择。',test:'负责人能否在不了解短信服务的情况下完成取舍。',input:'输入“接受推荐”或 <code>A</code>；输入“改用短信”或 <code>B</code>；输入“暂停”或 <code>C</code>。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label warn">需要你的决定 · 当前交付已暂停在安全边界</div><div class="block decision"><div class="warn">短信提醒会增加每月成本</div><div class="desc">影响：第一期成本与交付范围。当前邮件提醒已满足你批准的“预约后提醒”。</div><div class="metric"><span>BYZ 推荐</span><span class="value">首期先使用邮件提醒；短信放入下一阶段。</span></div><div class="metric"><span>选择 A</span><span>保持原范围；月成本不增加；按当前计划继续。</span></div><div class="metric"><span>选择 B</span><span>新增“短信提醒”；月成本增加；BYZ 生成规格 v0.2，等待重新批准。</span></div><div class="metric"><span>不会改变</span><span>在线预约、店员日历与现有三项验收标准。</span></div></div><div class="choice"><span class="key">A</span> 接受推荐并继续　　<span class="key">B</span> 改用短信　　<span class="key">C</span> 暂停讨论</div><div class="prompt">› 等待你的决定 <span class="cursor"></span></div>`},
{title:'05 · 验证失败',legend:'失败不伪装成进度',copy:'并非每个问题都要升级给负责人。BYZ 先说明是否影响已批准结果，并给出恢复动作。',test:'负责人能否分辨“BYZ 正在自行修复”和“我需要介入”。',input:'无需输入。BYZ 先自行修复；仅跨越批准边界时升级给负责人。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label warn">验证发现问题 · 你暂时无需操作</div><div class="block decision"><div class="warn">部分提醒在网络中断后没有自动补发</div><div class="desc">影响：不满足“每次预约都有提醒记录”的验收标准，因此当前不能进入发布。</div><div class="metric"><span>BYZ 正在做</span><span class="value">补充失败重试，并重新验证该标准。</span></div><div class="metric"><span>何时找你</span><span>若修复会改变范围、成本、交付日期，或两次验证仍失败。</span></div><div class="metric"><span>现在不做</span><span>不会为一个可修复问题要求你阅读错误详情。</span></div></div><div class="sub">交付状态：验证中 · 发布尚未发生</div>`},
{title:'06 · 等待验收',legend:'证据替代解释',copy:'这是第二次关键责任动作。验收页必须将每条批准过的标准，直接连到结果。',test:'负责人是否无需开发者翻译，就能决定发布或退回。',input:'输入“批准发布”或 <code>A</code>；输入“退回修复”或 <code>B</code>；输入 <code>1–3</code> 查看单项证据。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label">等待你的验收 · 三项承诺均已验证</div><div class="block success"><div class="metric"><span>1 · 客户在线预约</span><span class="good">通过　3 个时间段均可完成预约 [预览]</span></div><div class="metric"><span>2 · 店员当日安排</span><span class="good">通过　新预约即时出现在当日日历 [截图]</span></div><div class="metric"><span>3 · 预约邮件提醒</span><span class="good">通过　3 次发送成功；断网后自动补发 [记录]</span></div></div><div class="block"><div class="gold">本次交付摘要</div><div>完成 3 项已批准能力；未扩大范围；所有验收标准都有证据。</div></div><div class="choice"><span class="key">A</span> 批准发布　　<span class="key">B</span> 退回修复</div><div class="prompt">› 等待你的决定 <span class="cursor"></span></div>`},
{title:'07 · 发布后归档',legend:'结果可以追溯',copy:'完成后不是抛出一段总结，而是形成下一次变更可以继续使用的责任记录。',test:'用户是否知道“发布了什么、基于什么批准、下一步从哪里开始”。',input:'输入新变化；或输入 <code>resume</code> 回到上次等待你决定的位置。',body:`<div class="logo">BYZ <span class="sub">/ 客户预约系统</span></div><div class="label good">已发布 · v1.0 · 下次启动可从此处恢复</div><div class="block success"><div class="good">交付已归档</div><div>你的目标、批准范围、一次范围取舍、三项验收证据与发布决定，均已保存在本机。</div></div><div class="block"><div class="gold">下一次你可以直接说</div><div class="value">“在预约完成后，增加会员积分。”</div><div class="sub small">BYZ 会从当前项目与已批准范围继续，而不是从零开始聊天。</div><div class="foot">下次打开 BYZ：<span class="value">上次停在：已发布 v1.0。输入新变化，或输入 resume 重看交付记录。</span></div></div><div class="prompt">› 等待下一个业务目标 <span class="cursor"></span></div>`}
];
const tabs=document.getElementById('tabs'),screens=document.getElementById('screens');scenarios.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>show(i);tabs.appendChild(b);const x=document.createElement('section');x.className='screen';x.innerHTML=s.body;screens.appendChild(x)});function show(i){[...tabs.children].forEach((b,n)=>b.classList.toggle('active',n===i));[...screens.children].forEach((s,n)=>s.classList.toggle('active',n===i));document.getElementById('legend-title').textContent=scenarios[i].legend;document.getElementById('legend-copy').textContent=scenarios[i].copy;document.getElementById('legend-test').textContent=scenarios[i].test;document.getElementById('legend-input').innerHTML=scenarios[i].input}show(0);
</script></body></html>
